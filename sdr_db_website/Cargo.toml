[package]
name = "sdr_db_website"
version = "0.1.0"
authors = ["nuts_rice <red44443@gmail.com>"]
license = "MIT"
edition = "2021"

[dependencies]
ratatui = { version = "0.29.0", default-features = false }
sdr_db = { path = "..", default-features = false, features = ["wasm", "api"] }
color-eyre = "0.6.5"
ratzilla = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yew = "0.21.0"
yew-hooks = "0.3.4"
web-sys = { version = "0.3.82", features = ["Geolocation"] }
wasm-bindgen = "0.2.105"
dotenvy = "0.15.7"
gloo-net = { version = "0.6.0", features = ["http"] }
axum = "0.8.8"
wasm-bindgen-futures = "0.4.56"
