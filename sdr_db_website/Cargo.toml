[package]
name = "sdr_db_website"
version = "0.1.0"
authors = ["nuts_rice <red44443@gmail.com>"]
license = "MIT"
edition = "2021"

[dependencies]
ratatui = { version = "0.29.0", default-features = false }
sdr_db = { path = "..", default-features = false, features = ["wasm"] }
color-eyre = "0.6.5"
ratzilla = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yew = "0.21.0"
yew-hooks = "0.3.4"
web-sys = { version = "0.3.82", features = ["Geolocation", "WebSocket", "MessageEvent", "HtmlCanvasElement", "CanvasRenderingContext2d", "Document", "Window", "Performance"] }
wasm-bindgen = "0.2.105"
gloo-net = { version = "0.6.0", features = ["http"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
wasm-bindgen-futures = "0.4.56"
#diesel = { version = "2.3.5", features = ["sqlite"] }
