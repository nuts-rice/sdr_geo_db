[package]
name = "sdr_db"
description = "An SDR application with database support and optional web API."
homepage = "https://sdr-geo-db.vercel.app/"
repository = "https://github.com/nuts-rice/sdr_geo_db"
readme = "README.md"
categories = ["science", "geospatial", "database"]
keywords = ["sdr", "database", "geo", "wasm", "api", "soapysdr", "tui"]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["db", "sdr", "native-ui"]
db = ["diesel", "dotenvy"]
sdr = ["soapysdr"]
native-ui = ["crossterm", "tui-input/crossterm", "tui-prompts", "tui-textarea", "tui"]
wasm = []
api = ["axum", "tower", "tower-http", "serde_json", "thiserror", "db"]
axum = ["dep:axum"]

[dependencies]
# Database dependencies (native only)
diesel = { version = "2.3.2", features = ["postgres", "chrono", "r2d2"], optional = true }
# TODO: this breaks because of clang needed
# Use this in local-first migration
#libsqlite3-sys = { version = "0.27", features = ["sqlcipher"] }
#sled = "0.34.7"
dotenvy = { version = "0.15.7", optional = true }

# Core dependencies (WASM compatible)
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
geo-types = "0.7"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
geo = "0.31.0"
ratatui = { version = "0.29.0", default-features = false }
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
crossterm = { version = "0.29.0", optional = true }
color-eyre = "0.6.5"
catppuccin = "2.6.0"
async-trait = "0.1.89"
num-complex = "0.4.6"
ratzilla = "0.2.0"

# SDR dependencies (native only)
soapysdr = { version = "0.4.2", optional = true }

# Native UI dependencies
tui-input = { version = "0.14.0", default-features = false, optional = true }
tui-prompts = { version = "0.5.0", optional = true }
tui-textarea = { version = "0.7.0", optional = true }
tui = { version = "0.19.0", optional = true }

# API server dependencies
axum = { version = "0.7", optional = true, features = ["ws"] }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = { version = "1.0", optional = true }
rustfft = "6.4.1"
tokio = { version = "1.48.0", features = ["time"] }



[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.48.0", features = ["sync", "rt-multi-thread", "macros"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.48.0", features = ["sync", "macros"] }


[[bin]]
name = "api"
path = "src/bin/api.rs"
required-features = ["api"]

[dev-dependencies]
proptest = "1.4"
