apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdr-db-api
  namespace: default
  labels:
    app: sdr-db-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdr-db-api
  template:
    metadata:
      labels:
        app: sdr-db-api
    spec:
      containers:
      - name: api
        image: sdr-db-api:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sdr-db-secrets
              key: database-url
        - name: ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: sdr-db-secrets
              key: allowed-origins
        - name: API_PORT
          value: "3000"
        - name: RUST_LOG
          value: "info,api=debug"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
